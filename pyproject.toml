[project]
name = "sinhala-latent-language"
version = "0.1.0"
description = "Does a multilingual LLM pivot through English when prompted in Sinhala?"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
